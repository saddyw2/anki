<head>
<meta charset="utf-8">

<style>
/* Sol MED — identidad visual
 * Rosa · rosa pastel · lila · lavanda · violeta suave.
 * Tipografía: Sora (títulos), Manrope (texto), IBM Plex Mono (valores).
 */
:root {
  --bg: #fbf7fc;
  --bg-2: #f3ebf8;
  --surface: rgba(255, 255, 255, 0.78);
  --surface-solid: #ffffff;
  --surface-2: #f7f0fa;
  --surface-3: #efe5f6;
  --ink: #2a1f33;
  --ink-2: #54465f;
  --muted: #7d6e8a;
  --line: rgba(92, 60, 120, 0.14);
  --line-2: rgba(92, 60, 120, 0.24);
  --rose: #c2447f;
  --rose-ink: #a83a6e;
  --rose-soft: #f9dcea;
  --pink: #e57aae;
  --lilac: #b79ce0;
  --lavender: #ebe3f8;
  --violet: #7c5cc4;
  --violet-ink: #6547ad;
  --violet-soft: #e7defa;
  --grad: linear-gradient(135deg, #c2447f 0%, #8e5ccb 100%);
  --grad-soft: linear-gradient(135deg, #fbe3ef 0%, #ece3fb 100%);
  --on-accent: #ffffff;
  --ok: #1d7f60;
  --ok-bg: #dcf2e8;
  --warn: #9a5f12;
  --warn-bg: #fbecd6;
  --bad: #b8324e;
  --bad-bg: #fbe1e7;
  --info-bg: #ece6fb;
  --focus: #7c5cc4;
  --shadow: 0 1px 2px rgba(60, 30, 80, 0.06), 0 10px 28px rgba(110, 60, 140, 0.08);
  --shadow-lg: 0 2px 6px rgba(60, 30, 80, 0.08), 0 20px 48px rgba(110, 60, 140, 0.14);
  --radius: 20px;
  --radius-sm: 13px;
  --radius-xs: 9px;
  --font-display: 'Sora', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-body: 'Manrope', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --nav-h: 64px;
  --blob-1: rgba(236, 140, 190, 0.22);
  --blob-2: rgba(170, 140, 235, 0.22);
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #15101b;
    --bg-2: #1c1524;
    --surface: rgba(38, 29, 49, 0.74);
    --surface-solid: #231a2d;
    --surface-2: #2a2036;
    --surface-3: #33273f;
    --ink: #f4ecf8;
    --ink-2: #d2c4dd;
    --muted: #a595b4;
    --line: rgba(225, 195, 255, 0.12);
    --line-2: rgba(225, 195, 255, 0.22);
    --rose: #f08dba;
    --rose-ink: #f5a6ca;
    --rose-soft: #4b2239;
    --pink: #f2a2c7;
    --lilac: #c9b3f0;
    --lavender: #2f2442;
    --violet: #b39af2;
    --violet-ink: #c6b2f6;
    --violet-soft: #372a52;
    --grad: linear-gradient(135deg, #b8467e 0%, #7453c2 100%);
    --grad-soft: linear-gradient(135deg, #3a2033 0%, #2c2446 100%);
    --ok: #62d3a8;
    --ok-bg: #16372d;
    --warn: #f0b867;
    --warn-bg: #3b2b14;
    --bad: #f58ba0;
    --bad-bg: #44202a;
    --info-bg: #2c2446;
    --focus: #c6b2f6;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 28px rgba(0, 0, 0, 0.28);
    --shadow-lg: 0 2px 6px rgba(0, 0, 0, 0.35), 0 20px 48px rgba(0, 0, 0, 0.4);
    --blob-1: rgba(200, 80, 140, 0.16);
    --blob-2: rgba(120, 90, 210, 0.18);
    color-scheme: dark;
  }
}

:root[data-theme='dark'] {
  --bg: #15101b;
  --bg-2: #1c1524;
  --surface: rgba(38, 29, 49, 0.74);
  --surface-solid: #231a2d;
  --surface-2: #2a2036;
  --surface-3: #33273f;
  --ink: #f4ecf8;
  --ink-2: #d2c4dd;
  --muted: #a595b4;
  --line: rgba(225, 195, 255, 0.12);
  --line-2: rgba(225, 195, 255, 0.22);
  --rose: #f08dba;
  --rose-ink: #f5a6ca;
  --rose-soft: #4b2239;
  --pink: #f2a2c7;
  --lilac: #c9b3f0;
  --lavender: #2f2442;
  --violet: #b39af2;
  --violet-ink: #c6b2f6;
  --violet-soft: #372a52;
  --grad: linear-gradient(135deg, #b8467e 0%, #7453c2 100%);
  --grad-soft: linear-gradient(135deg, #3a2033 0%, #2c2446 100%);
  --ok: #62d3a8;
  --ok-bg: #16372d;
  --warn: #f0b867;
  --warn-bg: #3b2b14;
  --bad: #f58ba0;
  --bad-bg: #44202a;
  --info-bg: #2c2446;
  --focus: #c6b2f6;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 28px rgba(0, 0, 0, 0.28);
  --shadow-lg: 0 2px 6px rgba(0, 0, 0, 0.35), 0 20px 48px rgba(0, 0, 0, 0.4);
  --blob-1: rgba(200, 80, 140, 0.16);
  --blob-2: rgba(120, 90, 210, 0.18);
  color-scheme: dark;
}

/* ---------- Base ---------- */
*,
*::before,
*::after {
  box-sizing: border-box;
}
html {
  -webkit-text-size-adjust: 100%;
  height: 100%;
}
body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(38rem 28rem at 8% -6%, var(--blob-1), transparent 70%),
    radial-gradient(34rem 30rem at 100% 12%, var(--blob-2), transparent 70%);
}
h1,
h2,
h3,
h4 {
  font-family: var(--font-display);
  font-weight: 600;
  line-height: 1.2;
  margin: 0;
  text-wrap: balance;
  letter-spacing: -0.01em;
}
h1 {
  font-size: 1.6rem;
}
h2 {
  font-size: 1.25rem;
}
h3 {
  font-size: 1.05rem;
}
h4 {
  font-size: 0.95rem;
}
p {
  margin: 0;
}
a {
  color: var(--violet-ink);
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
:focus-visible {
  outline: 2.5px solid var(--focus);
  outline-offset: 2px;
  border-radius: 6px;
}
[hidden] {
  display: none !important;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
.mono,
.num {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
}
.muted {
  color: var(--muted);
}
.small {
  font-size: 0.86rem;
}
.tiny {
  font-size: 0.76rem;
}
.eyebrow {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--rose-ink);
}
.stack {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.stack-lg {
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.row-between {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}
.grow {
  flex: 1 1 auto;
  min-width: 0;
}

/* ---------- Estructura ---------- */
.app {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  min-height: 100dvh;
}
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(14px) saturate(1.2);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
  border-bottom: 1px solid var(--line);
}
.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  text-decoration: none;
  color: var(--ink);
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
}
.brand-mark {
  width: 30px;
  height: 30px;
  flex: none;
}
.brand-name {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.08rem;
  letter-spacing: -0.02em;
}
.brand-name b {
  background: var(--grad);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.topbar .spacer {
  flex: 1;
}
.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 42px;
  height: 42px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
  cursor: pointer;
}
.icon-btn:hover {
  border-color: var(--line-2);
  color: var(--ink);
}
.icon {
  width: 20px;
  height: 20px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: none;
}
.sync-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--muted);
  display: inline-block;
}
.sync-dot.ok {
  background: var(--ok);
}
.sync-dot.error,
.sync-dot.offline {
  background: var(--warn);
}

.main {
  padding-inline: 16px;
  padding-block: 18px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px));
  max-width: 880px;
  margin: 0 auto;
}

/* Barra inferior (móvil) */
.bottomnav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 30;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
  background: color-mix(in srgb, var(--surface-solid) 90%, transparent);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--line);
}
.navbtn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-height: 52px;
  justify-content: center;
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 0.72rem;
  font-weight: 600;
  border-radius: 14px;
  cursor: pointer;
}
.navbtn .icon {
  width: 22px;
  height: 22px;
}
.navbtn[aria-current='page'] {
  color: var(--rose-ink);
  background: var(--rose-soft);
}

/* Barra lateral (escritorio) */
.sidenav {
  display: none;
}
@media (min-width: 980px) {
  .app {
    display: grid;
    grid-template-columns: 250px 1fr;
  }
  .sidenav {
    display: flex;
    flex-direction: column;
    gap: 2px;
    position: sticky;
    top: 0;
    height: 100vh;
    padding: 18px 14px;
    border-right: 1px solid var(--line);
    background: color-mix(in srgb, var(--surface-solid) 55%, transparent);
    overflow-y: auto;
  }
  .sidenav .brand {
    padding: 6px 10px 16px;
  }
  .sidenav .group-label {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 14px 12px 4px;
  }
  .sidelink {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-radius: 11px;
    border: 0;
    background: none;
    color: var(--ink-2);
    font-weight: 600;
    font-size: 0.92rem;
    text-align: left;
    cursor: pointer;
  }
  .sidelink:hover {
    background: var(--surface-2);
    color: var(--ink);
  }
  .sidelink[aria-current='page'] {
    background: var(--rose-soft);
    color: var(--rose-ink);
  }
  .bottomnav {
    display: none;
  }
  .topbar .brand {
    display: none;
  }
  .main {
    padding-inline: 32px;
    padding-block: 26px 48px;
  }
  .appcol {
    min-width: 0;
  }
}

/* ---------- Superficies ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.card.flat {
  box-shadow: none;
  background: var(--surface-2);
  backdrop-filter: none;
}
.card.tight {
  padding: 14px;
}
.section-title {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
}
.page-head {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 18px;
}
.page-head p {
  color: var(--ink-2);
  max-width: 62ch;
}
.back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 0;
  background: none;
  color: var(--muted);
  font-weight: 600;
  padding: 4px 0;
  cursor: pointer;
  font-size: 0.9rem;
}
.back:hover {
  color: var(--ink);
}

/* ---------- Botones ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 48px;
  padding: 10px 18px;
  border-radius: 14px;
  border: 1px solid var(--line-2);
  background: var(--surface-solid);
  color: var(--ink);
  font-weight: 700;
  font-size: 0.97rem;
  cursor: pointer;
  text-decoration: none;
  transition:
    transform 0.12s ease,
    box-shadow 0.12s ease,
    background 0.12s ease;
}
.btn:hover {
  border-color: var(--lilac);
}
.btn:active {
  transform: translateY(1px);
}
.btn[disabled] {
  opacity: 0.5;
  cursor: not-allowed;
}
.btn-primary {
  background: var(--grad);
  color: var(--on-accent);
  border-color: transparent;
  box-shadow: 0 6px 18px rgba(170, 70, 140, 0.28);
}
.btn-primary:hover {
  border-color: transparent;
  box-shadow: 0 8px 24px rgba(170, 70, 140, 0.36);
}
.btn-soft {
  background: var(--violet-soft);
  color: var(--violet-ink);
  border-color: transparent;
}
.btn-ghost {
  background: transparent;
  border-color: transparent;
  color: var(--ink-2);
}
.btn-ghost:hover {
  background: var(--surface-2);
  border-color: transparent;
}
.btn-danger {
  background: var(--bad-bg);
  color: var(--bad);
  border-color: transparent;
}
.btn-sm {
  min-height: 38px;
  padding: 6px 12px;
  font-size: 0.88rem;
  border-radius: 11px;
}
.btn-block {
  width: 100%;
}

/* Chips y píldoras */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border-radius: 999px;
  background: var(--surface-3);
  color: var(--ink-2);
  font-size: 0.78rem;
  font-weight: 600;
  white-space: nowrap;
}
.chip.rose {
  background: var(--rose-soft);
  color: var(--rose-ink);
}
.chip.violet {
  background: var(--violet-soft);
  color: var(--violet-ink);
}
.chip.ok {
  background: var(--ok-bg);
  color: var(--ok);
}
.chip.warn {
  background: var(--warn-bg);
  color: var(--warn);
}
.chip.bad {
  background: var(--bad-bg);
  color: var(--bad);
}
.state-new {
  --st: var(--muted);
}
.state-weak {
  --st: var(--bad);
}
.state-progress {
  --st: var(--warn);
}
.state-good {
  --st: var(--violet);
}
.state-mastered {
  --st: var(--ok);
}

/* Controles segmentados y selección */
.seg {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 4px;
  border-radius: 14px;
  background: var(--surface-2);
  border: 1px solid var(--line);
}
.seg button {
  min-height: 40px;
  padding: 6px 14px;
  border-radius: 10px;
  border: 0;
  background: transparent;
  color: var(--ink-2);
  font-weight: 600;
  font-size: 0.9rem;
  cursor: pointer;
}
.seg button[aria-pressed='true'] {
  background: var(--surface-solid);
  color: var(--ink);
  box-shadow: var(--shadow);
}
.checklist {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.check {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 42px;
  padding: 6px 14px;
  border-radius: 12px;
  border: 1px solid var(--line-2);
  background: var(--surface-solid);
  cursor: pointer;
  font-weight: 600;
  font-size: 0.92rem;
}
.check[aria-pressed='true'] {
  border-color: var(--rose);
  background: var(--rose-soft);
  color: var(--rose-ink);
}
.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.field label,
.label {
  font-weight: 700;
  font-size: 0.86rem;
  color: var(--ink-2);
}
.input,
textarea.input,
select.input {
  width: 100%;
  min-height: 48px;
  padding: 10px 14px;
  border-radius: 13px;
  border: 1px solid var(--line-2);
  background: var(--surface-solid);
  color: var(--ink);
}
textarea.input {
  min-height: 110px;
  resize: vertical;
  line-height: 1.5;
}
.input:focus {
  outline: 2px solid var(--focus);
  outline-offset: 1px;
}

/* ---------- Inicio ---------- */
.hero {
  position: relative;
  overflow: hidden;
  border-radius: 24px;
  padding: 22px;
  background: var(--grad-soft);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
}
.hero::after {
  content: '';
  position: absolute;
  right: -40px;
  top: -40px;
  width: 190px;
  height: 190px;
  border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--pink) 45%, transparent), transparent 70%);
  pointer-events: none;
}
.hero h1 {
  font-size: 1.45rem;
}
.hero-stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin: 14px 0 16px;
}
.hero-stat {
  background: color-mix(in srgb, var(--surface-solid) 70%, transparent);
  border-radius: 14px;
  padding: 10px 12px;
}
.hero-stat .n {
  font-family: var(--font-display);
  font-size: 1.35rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.hero-stat .l {
  font-size: 0.76rem;
  color: var(--ink-2);
  font-weight: 600;
}
.tiles {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
@media (min-width: 640px) {
  .tiles {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
.tile {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
  min-height: 104px;
  padding: 14px;
  border-radius: 17px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  text-align: left;
  cursor: pointer;
  box-shadow: 0 1px 2px rgba(60, 30, 80, 0.04);
  transition:
    transform 0.14s ease,
    border-color 0.14s ease,
    box-shadow 0.14s ease;
}
.tile:hover {
  transform: translateY(-2px);
  border-color: var(--lilac);
  box-shadow: var(--shadow);
}
.tile .ic {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: 11px;
  background: var(--lavender);
  color: var(--violet-ink);
}
.tile:nth-child(3n + 2) .ic {
  background: var(--rose-soft);
  color: var(--rose-ink);
}
.tile .t {
  font-weight: 700;
  font-size: 0.95rem;
  line-height: 1.25;
}
.tile .d {
  font-size: 0.78rem;
  color: var(--muted);
  line-height: 1.35;
}
.resume-card {
  display: flex;
  align-items: center;
  gap: 14px;
}
.resume-ic {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  flex: none;
  border-radius: 14px;
  background: var(--rose-soft);
  color: var(--rose-ink);
}
.bar {
  position: relative;
  height: 8px;
  border-radius: 99px;
  background: var(--surface-3);
  overflow: hidden;
}
.bar > span {
  position: absolute;
  inset: 0 auto 0 0;
  border-radius: 99px;
  background: var(--st, var(--violet));
}
.topic-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 4px 12px;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}
.topic-row:last-child {
  border-bottom: 0;
}
.topic-row .bar {
  grid-column: 1 / -1;
}
.topic-row .pctv {
  font-family: var(--font-mono);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

/* ---------- Ejecutor de preguntas ---------- */
.runner-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.runner-progress {
  flex: 1;
  height: 6px;
  border-radius: 99px;
  background: var(--surface-3);
  overflow: hidden;
}
.runner-progress > span {
  display: block;
  height: 100%;
  background: var(--grad);
  border-radius: 99px;
  transition: width 0.3s ease;
}
.qmeta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
}
.stem {
  font-size: 1.06rem;
  line-height: 1.6;
  font-weight: 500;
}
.vignette {
  display: flex;
  flex-direction: column;
  gap: 10px;
  font-size: 1rem;
  line-height: 1.62;
}
.vitals {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
  gap: 8px;
}
.vital {
  background: var(--surface-2);
  border-radius: 12px;
  padding: 8px 10px;
}
.vital .k {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--muted);
  text-transform: uppercase;
}
.vital .v {
  font-family: var(--font-mono);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}
.block-title {
  font-size: 0.74rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
}
.labs {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.95rem;
}
.labs-wrap {
  overflow-x: auto;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--surface-solid);
}
.labs th,
.labs td {
  padding: 9px 12px;
  text-align: left;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}
.labs tr:last-child td {
  border-bottom: 0;
}
.labs th {
  font-size: 0.74rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 700;
  background: var(--surface-2);
}
.labs td.v {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.labs td.ref {
  color: var(--muted);
  font-size: 0.84rem;
  white-space: nowrap;
}
.flag {
  display: inline-block;
  min-width: 26px;
  text-align: center;
  font-weight: 700;
  border-radius: 7px;
  padding: 0 6px;
  font-size: 0.8rem;
}
.flag.H {
  background: var(--rose-soft);
  color: var(--rose-ink);
}
.flag.L {
  background: var(--violet-soft);
  color: var(--violet-ink);
}
.flag.N {
  background: var(--surface-3);
  color: var(--muted);
}
/* Lista compacta de laboratorio en móvil */
@media (max-width: 520px) {
  .labs thead {
    display: none;
  }
  .labs tr {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 2px 10px;
    padding: 9px 12px;
    border-bottom: 1px solid var(--line);
  }
  .labs tr:last-child {
    border-bottom: 0;
  }
  .labs td {
    padding: 0;
    border: 0;
  }
  .labs td.ref {
    grid-column: 1 / -1;
    font-size: 0.78rem;
  }
  .labs td.flagcell {
    grid-column: 1 / -1;
    padding-top: 6px;
  }
}
.flagpick {
  display: inline-flex;
  gap: 4px;
}
.flagpick button {
  min-width: 46px;
  min-height: 40px;
  border-radius: 10px;
  border: 1px solid var(--line-2);
  background: var(--surface-solid);
  font-weight: 700;
  cursor: pointer;
  color: var(--ink-2);
}
.flagpick button[aria-pressed='true'] {
  background: var(--violet);
  border-color: var(--violet);
  color: var(--on-accent);
}
.flagpick button.right {
  outline: 2px solid var(--ok);
}
.flagpick button.wrong {
  background: var(--bad-bg);
  border-color: var(--bad);
  color: var(--bad);
}

.options {
  display: flex;
  flex-direction: column;
  gap: 9px;
  margin-top: 14px;
}
.opt {
  display: grid;
  grid-template-columns: 34px 1fr;
  gap: 12px;
  align-items: start;
  width: 100%;
  min-height: 54px;
  padding: 12px 14px;
  border-radius: 15px;
  border: 1.5px solid var(--line-2);
  background: var(--surface-solid);
  text-align: left;
  cursor: pointer;
  line-height: 1.45;
  transition:
    border-color 0.12s ease,
    background 0.12s ease;
}
.opt:hover:not([disabled]) {
  border-color: var(--lilac);
}
.opt .letter {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 9px;
  background: var(--surface-3);
  font-weight: 700;
  font-size: 0.86rem;
  color: var(--ink-2);
}
.opt[aria-pressed='true'] {
  border-color: var(--violet);
  background: var(--violet-soft);
}
.opt[aria-pressed='true'] .letter {
  background: var(--violet);
  color: var(--on-accent);
}
.opt.correct {
  border-color: var(--ok);
  background: var(--ok-bg);
}
.opt.correct .letter {
  background: var(--ok);
  color: var(--surface-solid);
}
.opt.wrong {
  border-color: var(--bad);
  background: var(--bad-bg);
}
.opt.wrong .letter {
  background: var(--bad);
  color: var(--surface-solid);
}
.opt[disabled] {
  cursor: default;
}
.opt.dim {
  opacity: 0.62;
}
.confidence {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 14px;
}
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 16px;
}
.actions .btn {
  flex: 1 1 160px;
}
.actions-sticky {
  position: sticky;
  bottom: calc(var(--nav-h) + 10px + env(safe-area-inset-bottom, 0px));
  z-index: 5;
  padding: 10px;
  margin-inline: -10px;
  border-radius: 18px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
@media (min-width: 980px) {
  .actions-sticky {
    bottom: 12px;
  }
}
/* En móvil, la barra del simulacro ocupa una sola fila. */
@media (max-width: 560px) {
  .exam-actions {
    display: grid;
    grid-template-columns: auto auto minmax(0, 1fr);
  }
  .exam-actions .btn {
    flex: none;
    padding-inline: 14px;
  }
  .exam-actions .lbl {
    display: none;
  }
  .exam-actions .btn-primary .lbl {
    display: inline;
  }
}

/* Retroalimentación */
.verdict {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  border-radius: 16px;
  font-weight: 700;
}
.verdict.ok {
  background: var(--ok-bg);
  color: var(--ok);
}
.verdict.bad {
  background: var(--bad-bg);
  color: var(--bad);
}
.verdict.partial {
  background: var(--warn-bg);
  color: var(--warn);
}
.verdict .sub {
  font-weight: 500;
  color: var(--ink-2);
  font-size: 0.9rem;
}
.fb {
  display: flex;
  flex-direction: column;
  gap: 14px;
  margin-top: 14px;
}
.fb-sec h4 {
  font-family: var(--font-body);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--rose-ink);
  margin-bottom: 6px;
}
.fb-sec ol,
.fb-sec ul {
  margin: 0;
  padding-left: 1.25rem;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.fb-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
}
@media (min-width: 640px) {
  .fb-grid {
    grid-template-columns: 1fr 1fr;
  }
}
.fb-kv {
  background: var(--surface-2);
  border-radius: 13px;
  padding: 10px 12px;
}
.fb-kv .k {
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.why-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.why {
  display: grid;
  grid-template-columns: 26px 1fr;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 13px;
  background: var(--surface-2);
}
.why.is-correct {
  background: var(--ok-bg);
}
.why .letter {
  font-weight: 800;
  color: var(--muted);
}
.pearl {
  display: grid;
  grid-template-columns: 26px 1fr;
  gap: 10px;
  padding: 12px 14px;
  border-radius: 15px;
  background: var(--grad-soft);
  border: 1px solid var(--line);
}
.pearl .icon {
  color: var(--rose-ink);
}
.callout {
  padding: 12px 14px;
  border-radius: 14px;
  background: var(--info-bg);
  color: var(--ink);
  font-size: 0.93rem;
}
.callout.warn {
  background: var(--warn-bg);
}
.callout.bad {
  background: var(--bad-bg);
}
.callout.ok {
  background: var(--ok-bg);
}

/* Razonamiento abierto */
.points {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.point {
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 10px;
  align-items: start;
  padding: 10px 12px;
  border-radius: 13px;
  border: 1px solid var(--line-2);
  background: var(--surface-solid);
  text-align: left;
  cursor: pointer;
}
.point .box {
  width: 24px;
  height: 24px;
  border-radius: 7px;
  border: 2px solid var(--line-2);
  display: grid;
  place-items: center;
}
.point[aria-pressed='true'] {
  border-color: var(--ok);
  background: var(--ok-bg);
}
.point[aria-pressed='true'] .box {
  background: var(--ok);
  border-color: var(--ok);
  color: var(--surface-solid);
}
.point .auto {
  font-size: 0.72rem;
  color: var(--muted);
}
.timeline {
  display: flex;
  flex-direction: column;
  gap: 12px;
  border-left: 2px solid var(--line-2);
  padding-left: 14px;
  margin-left: 6px;
}
.timeline .stage {
  position: relative;
}
.timeline .stage::before {
  content: '';
  position: absolute;
  left: -21px;
  top: 5px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--lilac);
  border: 2px solid var(--bg);
}
.timeline .stage.current::before {
  background: var(--rose);
}
.timeline .stage.alert::before {
  background: var(--bad);
}
.timeline .decision {
  font-size: 0.86rem;
  color: var(--ink-2);
  background: var(--surface-2);
  border-radius: 10px;
  padding: 6px 10px;
  margin-top: 6px;
}

/* Tarjeta de memoria */
.flash {
  min-height: 190px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 10px;
  text-align: center;
  padding: 26px 18px;
  border-radius: 22px;
  background: var(--grad-soft);
  border: 1px solid var(--line);
}
.flash .front {
  font-family: var(--font-display);
  font-size: 1.4rem;
  font-weight: 600;
}

/* ---------- Examen ---------- */
.timer {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 11px;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--ink-2);
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-size: 0.88rem;
  border: 1px solid var(--line);
}
.timer.warn {
  background: var(--warn-bg);
  color: var(--warn);
}
.timer.crit {
  background: var(--bad-bg);
  color: var(--bad);
}
.qnav {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(42px, 1fr));
  gap: 6px;
}
.qnav button {
  position: relative;
  height: 42px;
  border-radius: 11px;
  border: 1.5px solid var(--line-2);
  background: var(--surface-solid);
  font-family: var(--font-mono);
  font-weight: 500;
  cursor: pointer;
  color: var(--ink-2);
}
.qnav button.answered {
  background: var(--violet-soft);
  border-color: var(--violet-soft);
  color: var(--violet-ink);
}
.qnav button.flagged::after {
  content: '';
  position: absolute;
  top: 4px;
  right: 4px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--warn);
}
.qnav button.current {
  border-color: var(--rose);
  box-shadow: 0 0 0 2px var(--rose-soft);
  color: var(--ink);
}
.qnav button.correct {
  background: var(--ok-bg);
  border-color: var(--ok-bg);
  color: var(--ok);
}
.qnav button.incorrect {
  background: var(--bad-bg);
  border-color: var(--bad-bg);
  color: var(--bad);
}
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  font-size: 0.8rem;
  color: var(--ink-2);
}
.legend i {
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 4px;
  margin-right: 5px;
  vertical-align: -1px;
  border: 1.5px solid var(--line-2);
}
.kpis {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
@media (min-width: 640px) {
  .kpis {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}
.kpi {
  background: var(--surface-2);
  border-radius: 15px;
  padding: 12px 14px;
}
.kpi .n {
  font-family: var(--font-display);
  font-size: 1.4rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.kpi .l {
  font-size: 0.78rem;
  color: var(--ink-2);
  font-weight: 600;
}
.score-ring {
  width: 116px;
  height: 116px;
  flex: none;
}

/* ---------- Tablas genéricas ---------- */
.table-wrap {
  overflow-x: auto;
  border-radius: 14px;
  border: 1px solid var(--line);
}
.table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.92rem;
  background: var(--surface-solid);
}
.table th,
.table td {
  padding: 9px 12px;
  text-align: left;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
}
.table th {
  font-size: 0.74rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--muted);
  background: var(--surface-2);
}
.table tr:last-child td {
  border-bottom: 0;
}
.table td.num,
.table th.num {
  text-align: right;
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
}

/* ---------- Fichas (temas y valores) ---------- */
.sheet {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.sheet details {
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--surface);
  overflow: hidden;
}
.sheet summary {
  cursor: pointer;
  list-style: none;
  padding: 14px 16px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.sheet summary::-webkit-details-marker {
  display: none;
}
.sheet summary::after {
  content: '+';
  font-family: var(--font-mono);
  color: var(--muted);
  font-size: 1.1rem;
}
.sheet details[open] summary::after {
  content: '–';
}
.sheet .body {
  padding: 0 16px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-width: 70ch;
}
.sheet .body ul {
  margin: 0;
  padding-left: 1.2rem;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.value-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 10px;
}
.value-card {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 14px;
  border-radius: 16px;
  border: 1px solid var(--line);
  background: var(--surface);
  text-align: left;
  cursor: pointer;
}
.value-card:hover {
  border-color: var(--lilac);
}
.value-card .nm {
  font-weight: 700;
}
.value-card .rg {
  font-family: var(--font-mono);
  font-size: 0.9rem;
  color: var(--ink-2);
}
.scale {
  position: relative;
  height: 34px;
  margin: 8px 0 22px;
}
.scale .track {
  position: absolute;
  left: 0;
  right: 0;
  top: 12px;
  height: 10px;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--violet-soft) 0 33%, var(--ok-bg) 33% 67%, var(--rose-soft) 67% 100%);
}
.scale .lbl {
  position: absolute;
  top: 26px;
  font-size: 0.74rem;
  color: var(--muted);
  transform: translateX(-50%);
  white-space: nowrap;
  font-family: var(--font-mono);
}
.thresholds {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.thr {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 4px 10px;
  align-items: baseline;
  padding: 10px 12px;
  border-radius: 13px;
  background: var(--surface-2);
}
.thr .chip {
  grid-row: span 2;
  align-self: start;
}
.cmp-table td:first-child {
  font-weight: 700;
  color: var(--ink-2);
  width: 30%;
}

/* ---------- Gráficos ---------- */
.chart {
  width: 100%;
  height: auto;
  display: block;
  overflow: visible;
}
.chart .grid line {
  stroke: var(--line);
  stroke-width: 1;
}
.chart .axis text,
.chart text.lbl {
  fill: var(--muted);
  font-size: 11px;
  font-family: var(--font-body);
}
.chart text.val {
  fill: var(--ink-2);
  font-size: 11px;
  font-family: var(--font-mono);
}
.chart .line {
  fill: none;
  stroke: var(--violet);
  stroke-width: 2;
  stroke-linejoin: round;
  stroke-linecap: round;
}
.chart .area {
  fill: var(--violet);
  opacity: 0.12;
}
.chart .dot {
  fill: var(--violet);
  stroke: var(--surface-solid);
  stroke-width: 2;
}
.chart .barm {
  fill: var(--rose);
}
.chart .barm.alt {
  fill: var(--lilac);
}
.chart .hit {
  fill: transparent;
  cursor: crosshair;
}
.chart .cross {
  stroke: var(--line-2);
  stroke-width: 1;
}
.tip {
  position: fixed;
  z-index: 80;
  pointer-events: none;
  padding: 7px 10px;
  border-radius: 10px;
  background: var(--surface-solid);
  color: var(--ink);
  border: 1px solid var(--line-2);
  box-shadow: var(--shadow-lg);
  font-size: 0.82rem;
  max-width: 240px;
}
.hbars {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.hbar {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 4px 10px;
  font-size: 0.9rem;
}
.hbar .bar {
  grid-column: 1 / -1;
}

/* ---------- Diálogo y avisos ---------- */
.modal-back {
  position: fixed;
  inset: 0;
  z-index: 90;
  display: grid;
  place-items: center;
  padding: 16px;
  background: rgba(25, 12, 35, 0.42);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
.modal {
  width: min(460px, 100%);
  max-height: 88vh;
  overflow-y: auto;
  background: var(--surface-solid);
  border-radius: 22px;
  padding: 20px;
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.toasts {
  position: fixed;
  z-index: 95;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(var(--nav-h) + 18px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: min(420px, calc(100% - 32px));
  pointer-events: none;
}
@media (min-width: 980px) {
  .toasts {
    bottom: 24px;
  }
}
.toast {
  pointer-events: auto;
  padding: 11px 14px;
  border-radius: 14px;
  background: var(--surface-solid);
  border: 1px solid var(--line-2);
  box-shadow: var(--shadow-lg);
  font-size: 0.92rem;
  animation: toast-in 0.22s ease;
}
.toast.warn {
  border-color: var(--warn);
}
.toast.bad {
  border-color: var(--bad);
}
@keyframes toast-in {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
}
.status-list {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 0;
}
.status-list > div {
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}
.status-list > div:nth-last-child(-n + 2) {
  border-bottom: 0;
}
.status-list .v {
  text-align: right;
  font-weight: 600;
}
.feat {
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
  font-size: 0.93rem;
}
.feat:last-child {
  border-bottom: 0;
}
.empty {
  text-align: center;
  padding: 26px 16px;
  color: var(--ink-2);
}
.fade-in {
  animation: fade 0.25s ease;
}
@keyframes fade {
  from {
    opacity: 0.35;
    transform: translateY(4px);
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
:root.reduce-motion *,
:root.reduce-motion *::before,
:root.reduce-motion *::after {
  animation-duration: 0.01ms !important;
  transition-duration: 0.01ms !important;
}

<script>
/* js/core/namespace.js */
/* Sol MED — espacio de nombres global.
 * Se usan scripts clásicos (no módulos ES) para que la app funcione igual
 * desde un servidor, desde un archivo local (file://) o empaquetada en un

(function (root) {

/* js/core/util.js */
/* Utilidades puras (sin DOM). */
(function (S) {
  'use strict';

  const DAY = 86400000;
  const HOUR = 3600000;
  const MIN = 60000;

  function uid(prefix) {
    const rnd = Math.random().toString(36).slice(2, 8);
    return (prefix || '') + Date.now().toString(36) + rnd;
  }

  function clamp(x, lo, hi) {
    return Math.max(lo, Math.min(hi, x));
  }

  function round(x, d) {
    const f = Math.pow(10, d || 0);
    return Math.round(x * f) / f;
  }

  /** Formatea un número con coma decimal (es). */
  function num(x, d) {
    if (x === null || x === undefined || Number.isNaN(x)) return '—';
    const v = d === undefined ? x : round(x, d);
    // Coma decimal y separador de miles a partir de 5 cifras (17.800).

      return v.toLocaleString('es-ES', { maximumFractionDigits: 6 });
    } catch (e) {
      return String(v).replace('.', ',');
    }
  }

  /** Acepta "7,25" o "7.25". Devuelve NaN si no es un número. */
  function parseNum(s) {
    if (typeof s === 'number') return s;
    if (s === null || s === undefined) return NaN;
    const t = String(s).trim().replace(/\s/g, '').replace(',', '.');
    if (!/^[-+]?\d*\.?\d+$/.test(t)) return NaN;

  }

  function pct(x) {
    return Math.round(clamp(x, 0, 1) * 100);
  }

  /** Normaliza texto para comparar palabras clave: minúsculas, sin tildes. */
  function norm(s) {
    return String(s || '')
      .toLowerCase()
      .normalize('NFD')
      .replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9₀-₉⁺⁻%.,/ ]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  // Generador pseudoaleatorio reproducible (mulberry32).
  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function shuffle(arr, rand) {
    const r = rand || Math.random;
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      const t = a[i];
      a[i] = a[j];
      a[j] = t;
    }
    return a;
  }

  function pick(arr, rand) {
    const r = rand || Math.random;
    return arr[Math.floor(r() * arr.length)];
  }

  function randInt(lo, hi, rand) {
    const r = rand || Math.random;
    return lo + Math.floor(r() * (hi - lo + 1));
  }

  function randStep(lo, hi, step, rand) {
    const n = Math.round((hi - lo) / step);
    return round(lo + randInt(0, n, rand) * step, 4);
  }

  function groupBy(arr, fn) {
    const out = {};
    for (const x of arr) {
      const k = fn(x);
      (out[k] = out[k] || []).push(x);
    }
    return out;
  }

  function sum(arr, fn) {
    let s = 0;
    for (const x of arr) s += fn ? fn(x) : x;
    return s;
  }

  function mean(arr, fn) {
    return arr.length ? sum(arr, fn) / arr.length : 0;
  }

  function fmtClock(ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const ss = s % 60;
    const mm = h ? String(m).padStart(2, '0') : String(m).padStart(2, '0');
    return (h ? h + ':' : '') + mm + ':' + String(ss).padStart(2, '0');
  }

  function fmtDuration(ms) {
    const s = Math.round(ms / 1000);
    if (ms > 0 && s < 1) return '<1 s';
    if (s < 60) return s + ' s';
    const m = Math.floor(s / 60);
    const r = s % 60;
    if (m < 60) return m + ' min' + (r ? ' ' + r + ' s' : '');
    const h = Math.floor(m / 60);
    return h + ' h ' + (m % 60) + ' min';
  }

  function fmtDate(t) {
    if (!t) return '—';
    const d = new Date(t);
    return d.toLocaleDateString('es', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function fmtDateTime(t) {
    if (!t) return '—';
    const d = new Date(t);
    return (
      d.toLocaleDateString('es', { day: 'numeric', month: 'short' }) +
      ' ' +
      d.toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' })
    );
  }

  /** "en 3 días", "hace 2 h"… */
  function fmtRelative(t, now) {
    const n = now || Date.now();
    const d = t - n;
    const a = Math.abs(d);
    let s;
    if (a < MIN) s = 'menos de 1 min';
    else if (a < HOUR) s = Math.round(a / MIN) + ' min';
    else if (a < DAY) s = Math.round(a / HOUR) + ' h';
    else s = Math.round(a / DAY) + (Math.round(a / DAY) === 1 ? ' día' : ' días');
    return d >= 0 ? 'en ' + s : 'hace ' + s;
  }

  function dayKey(t) {
    const d = new Date(t);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function deepClone(x) {
    return x === undefined ? undefined : JSON.parse(JSON.stringify(x));
  }

  function escapeHtml(s) {
    return String(s === undefined || s === null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /** Marcado mínimo del contenido: **negrita**, _cursiva_, saltos de línea.
   *  Todo lo demás se escapa. */
  function rich(s) {
    return escapeHtml(s)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[\s(])_(.+?)_(?=[\s).,;:]|$)/g, '$1<em>$2</em>')
      .replace(/\n/g, '<br>');
  }

  S.util = {
    DAY,
    HOUR,
    MIN,
    uid,
    clamp,
    round,
    num,
    parseNum,
    pct,
    norm,
    rng,
    shuffle,
    pick,
    randInt,
    randStep,
    groupBy,
    sum,
    mean,
    fmtClock,
    fmtDuration,
    fmtDate,
    fmtDateTime,
    fmtRelative,
    dayKey,
    deepClone,
    escapeHtml,
    rich,
  };
})(window.SolMed);

;
/* js/core/registry.js */
/* Registro de contenido médico.
 *
 * Jerarquía: Especialidad → Área → Tema → Subtema → Conceptos → Ítems.
 * Los archivos de content/ solo llaman a SolMed.registry.add*(); el núcleo
 * nunca conoce los temas concretos. Añadir un tema = añadir un archivo.
 */
(function (S) {
  'use strict';

  const R = {
    specialties: {},
    errorTypes: {},
    categories: {},
    sources: {},
    topics: [],
    topicById: {},
    concepts: {},
    items: [],
    itemById: {},
    values: [],
    valueById: {},
    valueCategories: [],
    calcs: [],
    calcById: {},
    comparisons: [],
    finalized: false,
    problems: { errors: [], warnings: [] },
  };

  // Tipo de error por defecto según la categoría de la pregunta.
  const DEFAULT_ERR = {
    concepto: 'conocimiento',
    fisiopatologia: 'conocimiento',
    diagnostico: 'diferencial',
    diferencial: 'diferencial',
    laboratorio: 'laboratorio',
    calculo: 'calculo',
    tratamiento: 'tratamiento',
    secuencia: 'secuencia',
    complicaciones: 'complicaciones',
    integracion: 'razonamiento',
    razonamiento: 'razonamiento',
    valores: 'laboratorio',
  };

  function defineTaxonomy(t) {
    Object.assign(R.specialties, t.specialties || {});
    Object.assign(R.errorTypes, t.errorTypes || {});
    Object.assign(R.categories, t.categories || {});
  }

  function addSources(list) {
    for (const s of list) R.sources[s.id] = s;
  }

  function addValues(category, list) {
    if (!R.valueCategories.find((c) => c.id === category.id)) R.valueCategories.push(category);
    for (const v of list) {
      v.category = category.id;
      R.values.push(v);
      R.valueById[v.id] = v;
    }
  }

  function addCalcs(list) {
    for (const c of list) {
      R.calcs.push(c);
      R.calcById[c.id] = c;
    }
  }

  function addComparisons(list) {
    for (const c of list) R.comparisons.push(c);
  }

  function qualifyConcept(topicId, id) {
    return id.indexOf('.') >= 0 ? id : topicId + '.' + id;
  }

  /** Convierte las distintas formas de autor (mcq, case, progressive,
   *  reasoning, lab) en una forma única: cabecera + lista de pasos. */
  function normalizeItem(topic, raw) {
    const it = {
      id: topic.id + ':' + raw.id,
      localId: raw.id,
      topic: topic.id,
      type: raw.type,
      sub: raw.sub || (topic.subtopics[0] && topic.subtopics[0].id),
      concepts: (raw.concepts || []).map((c) => qualifyConcept(topic.id, c)),
      diff: raw.diff || 2,
      cat: raw.cat || 'concepto',
      err: raw.err,
      title: raw.title || '',
      compare: raw.compare || null,
      header: {
        patient: raw.patient || null,
        vignette: raw.vignette ? [].concat(raw.vignette) : [],
        vitals: raw.vitals || null,
        exam: raw.exam || null,
        labs: raw.labs || null,
        imaging: raw.imaging || null,
        context: raw.context || null,
      },
      steps: [],
      examEligible: raw.type === 'mcq' || raw.type === 'case',
    };

    if (raw.type === 'mcq') {
      it.steps.push(Object.assign({ kind: 'mcq' }, pickStep(raw)));
    } else if (raw.type === 'case') {
      for (const q of raw.questions) it.steps.push(Object.assign({ kind: 'mcq' }, q));
    } else if (raw.type === 'progressive') {
      for (const st of raw.stages) {
        const step = Object.assign({ kind: st.q ? 'mcq' : 'info' }, st.q || {});
        step.stageId = st.id;
        step.reveal = {
          title: st.title,
          text: st.text ? [].concat(st.text) : [],
          vitals: st.vitals || null,
          labs: st.labs || null,
          imaging: st.imaging || null,
          tone: st.tone || null,
        };
        step.end = !!st.end;
        step.goto = st.goto || null;
        it.steps.push(step);
      }
    } else if (raw.type === 'reasoning') {
      for (const p of raw.prompts) it.steps.push(Object.assign({ kind: 'text' }, p));
    } else if (raw.type === 'lab') {
      for (const s of raw.steps) it.steps.push(Object.assign({}, s));
    }

    it.steps.forEach((s, i) => {
      s.index = i;
      s.concepts = s.concepts ? s.concepts.map((c) => qualifyConcept(topic.id, c)) : it.concepts;
      s.cat = s.cat || it.cat;
      s.err = s.err || it.err || DEFAULT_ERR[s.cat] || 'razonamiento';
      s.diff = s.diff || it.diff;
    });
    return it;
  }

  function pickStep(raw) {
    const keys = ['stem', 'options', 'answer', 'explain', 'key', 'altered', 'pearl', 'remember', 'trap'];
    const o = {};
    for (const k of keys) if (raw[k] !== undefined) o[k] = raw[k];
    return o;
  }

  function addTopic(def) {
    const topic = {
      id: def.id,
      kind: def.kind || 'topic',
      name: def.name,
      short: def.short || def.name,
      specialty: def.specialty,
      area: def.area,
      group: def.group || '',
      reviewed: def.reviewed || null,
      sources: def.sources || [],
      summary: def.summary || '',
      subtopics: def.subtopics || [],
      concepts: [],
      sheet: def.sheet || [],
      items: [],
    };
    R.topics.push(topic);
    R.topicById[topic.id] = topic;
    for (const c of def.concepts || []) {
      const id = qualifyConcept(topic.id, c.id);
      const concept = { id, name: c.name, topic: topic.id, sub: c.sub || (topic.subtopics[0] && topic.subtopics[0].id) };
      topic.concepts.push(concept);
      R.concepts[id] = concept;
    }
    for (const raw of def.items || []) {
      const it = normalizeItem(topic, raw);
      topic.items.push(it);
      R.items.push(it);

  /** Crea los módulos transversales (valores y cálculos) a partir de lo
   *  registrado, y valida todo el contenido. Se llama una vez al arrancar. */
  function finalize() {
    if (R.finalized) return R.problems;
    if (R.values.length) {
      addTopic({
        id: 'valores',
        kind: 'tool',
        name: 'Valores normales y su interpretación',
        short: 'Valores',
        specialty: 'transversal',
        area: 'laboratorio',
        subtopics: R.valueCategories.map((c) => ({ id: c.id, name: c.name })),
        concepts: R.values.map((v) => ({ id: 'valores.' + v.id, name: v.name, sub: v.category })),
      });
    }
    if (R.calcs.length) {
      addTopic({
        id: 'calculos',
        kind: 'tool',
        name: 'Cálculos clínicos',
        short: 'Cálculos',
        specialty: 'transversal',
        area: 'calculos',
        subtopics: [{ id: 'calc', name: 'Cálculos' }],
        concepts: R.calcs.map((c) => ({ id: 'calculos.' + c.id, name: c.name, sub: 'calc' })),
      });
    }
    R.finalized = true;
    R.problems = validate();
    return R.problems;
  }

  function flagFor(lab) {
    if (lab.flag) return lab.flag;
    const v = R.valueById[lab.p];
    if (!v || typeof lab.v !== 'number') return 'N';
    if (v.low !== undefined && lab.v < v.low) return 'L';
    if (v.high !== undefined && lab.v > v.high) return 'H';
    return 'N';
  }

  /** Datos de presentación de una fila de laboratorio. */
  function labRow(lab) {
    const v = R.valueById[lab.p] || {};
    return {
      id: lab.p || lab.name,
      name: lab.name || v.name || lab.p,
      abbr: lab.abbr || v.abbr || v.name || lab.name,
      value: lab.text !== undefined ? lab.text : lab.v,
      unit: lab.unit !== undefined ? lab.unit : v.unit || '',
      ref: lab.ref || v.ref || '',
      flag: flagFor(lab),
      known: !!R.valueById[lab.p],
    };
  }

  function validate() {
    const errors = [];
    const warnings = [];
    const seen = {};
    for (const it of R.items) {
      if (seen[it.id]) errors.push('ID duplicado: ' + it.id);
      seen[it.id] = true;
      if (![1, 2, 3].includes(it.diff)) errors.push(it.id + ': dificultad inválida');
      if (!it.concepts.length) errors.push(it.id + ': sin conceptos');
      const topic = R.topicById[it.topic];
      if (!topic.subtopics.find((s) => s.id === it.sub)) errors.push(it.id + ': subtema desconocido ' + it.sub);
      if (!it.steps.length) errors.push(it.id + ': sin pasos');
      const labs = [].concat(it.header.labs || []);
      it.steps.forEach((s) => {
        for (const c of s.concepts) if (!R.concepts[c]) errors.push(it.id + ': concepto desconocido ' + c);
        if (!R.errorTypes[s.err]) errors.push(it.id + ': tipo de error desconocido ' + s.err);
        if (s.reveal && s.reveal.labs) labs.push(...s.reveal.labs);
        if (s.kind === 'mcq') {
          if (!s.stem) errors.push(it.id + '#' + s.index + ': sin enunciado');
          if (!Array.isArray(s.options) || s.options.length < 3 || s.options.length > 5)
            errors.push(it.id + '#' + s.index + ': número de opciones inválido');
          else if (!(s.answer >= 0 && s.answer < s.options.length))
            errors.push(it.id + '#' + s.index + ': respuesta fuera de rango');
          else {
            s.options.forEach((o, i) => {
              if (!o.t) errors.push(it.id + '#' + s.index + ': opción vacía');
              if (!o.why) warnings.push(it.id + '#' + s.index + ': opción ' + i + ' sin explicación');
              if (o.err && !R.errorTypes[o.err]) errors.push(it.id + ': tipo de error desconocido ' + o.err);
              if (o.next && !it.steps.find((x) => x.stageId === o.next))
                errors.push(it.id + ': rama a etapa inexistente ' + o.next);
            });
            const texts = s.options.map((o) => o.t);
            if (new Set(texts).size !== texts.length) errors.push(it.id + ': opciones repetidas');
          }
          if (!s.explain || !s.explain.length) warnings.push(it.id + '#' + s.index + ': sin razonamiento paso a paso');
          if (!s.pearl) warnings.push(it.id + '#' + s.index + ': sin perla');
        } else if (s.kind === 'text') {
          if (!s.q || !s.expected || !(s.points && s.points.length)) errors.push(it.id + '#' + s.index + ': razonamiento incompleto');
        } else if (s.kind === 'calc') {
          const c = R.calcById[s.calc];
          if (!c) errors.push(it.id + ': cálculo desconocido ' + s.calc);
          else {
            const miss = c.inputs.filter((inp) => typeof s.inputs[inp.id] !== 'number');
            if (miss.length) errors.push(it.id + ': faltan datos para ' + s.calc + ': ' + miss.map((m) => m.id).join(','));
          }
        } else if (s.kind === 'flags') {
          if (!labs.length) errors.push(it.id + ': paso de valores sin laboratorio');
        } else if (s.kind === 'info') {
          // narrativo
        } else errors.push(it.id + ': tipo de paso desconocido ' + s.kind);
        if (s.goto && !it.steps.find((x) => x.stageId === s.goto)) errors.push(it.id + ': goto inexistente ' + s.goto);
      });
      for (const l of labs) {
        if (l.p && !R.valueById[l.p]) errors.push(it.id + ': valor de laboratorio desconocido ' + l.p);
        if (!l.p && !l.name) errors.push(it.id + ': fila de laboratorio sin nombre');
      }

    for (const t of R.topics) {

/* content/calculos.js */
/* Cálculos clínicos. Cada cálculo define su fórmula, cómo generar
 * ejercicios nuevos, la sustitución y la interpretación.
 * Para añadir un cálculo: agrega un objeto con la misma forma. */
(function (S) {
  'use strict';
  const U = S.util;
  const n = (x, d) => U.num(x, d === undefined ? 0 : d);

  function scenario(rand, list) {
    return list[Math.floor(rand() * list.length)];
  }

  S.registry.addCalcs([
    {
      id: 'anion_gap',
      name: 'Anion gap',
      purpose: 'Clasificar una acidosis metabólica: con anion gap alto (se acumula un ácido no medido) o normal (pérdida de bicarbonato o ganancia de cloro).',
      formula: 'AG = Na⁺ − (Cl⁻ + HCO₃⁻)',
      inputs: [
        { id: 'na', label: 'Na⁺', unit: 'mEq/L', example: 134 },
        { id: 'cl', label: 'Cl⁻', unit: 'mEq/L', example: 98 },
        { id: 'hco3', label: 'HCO₃⁻', unit: 'mEq/L', example: 10 },
      ],
      unit: 'mEq/L',
      decimals: 0,
      tol: 1,
      tolText: '± 1',
      diff: 1,
      compute: (x) => x.na - (x.cl + x.hco3),
      substitute: (x) => 'AG = ' + n(x.na) + ' − (' + n(x.cl) + ' + ' + n(x.hco3) + ') = ' + n(x.na - x.cl - x.hco3),
      interpret: (r) =>
        r > 12
          ? 'Anion gap **elevado** (>12 mEq/L, rango orientativo 8–12): se acumulan aniones no medidos.'
          : r < 8
            ? 'Anion gap **bajo**: piensa primero en hipoalbuminemia.'
            : 'Anion gap **normal**: si hay acidosis, es hiperclorémica.',
      implication: (r) =>
        r > 12
          ? 'Busca cetoacidosis (β-OHB), acidosis láctica, insuficiencia renal o tóxicos. Corrige por albúmina y calcula el delta-delta para detectar trastornos mixtos.'
          : 'Si hay acidosis con AG normal: diarrea, acidosis tubular o reposición abundante con salino (típica en la recuperación de la CAD).',
      pitfall: 'No incluir el potasio si el rango de referencia de tu laboratorio no lo incluye, y no olvidar corregir por albúmina.',
      pearl: 'En la recuperación de la CAD el anion gap se cierra antes que el bicarbonato: la acidosis residual suele ser hiperclorémica.',
      generate(rand) {
        const s = scenario(rand, ['cad', 'cad', 'diarrea', 'lactica']);
        let x;
        if (s === 'cad') x = { na: U.randInt(128, 140, rand), cl: U.randInt(92, 104, rand), hco3: U.randInt(5, 15, rand) };
        else if (s === 'diarrea') x = { na: U.randInt(134, 142, rand), cl: U.randInt(110, 116, rand), hco3: U.randInt(13, 18, rand) };
        else x = { na: U.randInt(135, 142, rand), cl: U.randInt(96, 104, rand), hco3: U.randInt(12, 18, rand) };
        const ctx = {
          cad: 'Joven con diabetes tipo 1, vómitos y respiración profunda.',
          diarrea: 'Paciente con diarrea acuosa abundante durante 4 días.',
          lactica: 'Paciente séptico con hipotensión.',
        }[s];
        return { inputs: x, context: ctx, ask: 'Calcula el anion gap.' };
      },
    },
    {
      id: 'ag_albumina',
      name: 'Anion gap corregido por albúmina',
      purpose: 'Evitar que una hipoalbuminemia oculte una acidosis con anion gap alto.',
      formula: 'AG corregido = AG + 2,5 × (4,0 − albúmina [g/dL])',
      inputs: [
        { id: 'na', label: 'Na⁺', unit: 'mEq/L', example: 136 },
        { id: 'cl', label: 'Cl⁻', unit: 'mEq/L', example: 104 },
        { id: 'hco3', label: 'HCO₃⁻', unit: 'mEq/L', example: 18 },
        { id: 'alb', label: 'Albúmina', unit: 'g/dL', example: 2.0 },
      ],
      unit: 'mEq/L',
      decimals: 1,
      tol: 1,
      tolText: '± 1',
      diff: 2,
      compute: (x) => x.na - (x.cl + x.hco3) + 2.5 * (4 - x.alb),
      substitute: (x) => {
        const ag = x.na - x.cl - x.hco3;
        return 'AG = ' + n(x.na) + ' − (' + n(x.cl) + ' + ' + n(x.hco3) + ') = ' + n(ag) + ' → AG corregido = ' + n(ag) + ' + 2,5 × (4,0 − ' + n(x.alb, 1) + ') = ' + n(ag + 2.5 * (4 - x.alb), 1);
      },
      interpret: (r, x) => {
        const ag = x.na - x.cl - x.hco3;
        return r > 12 && ag <= 12
          ? 'El AG medido (' + n(ag) + ') parecía normal, pero corregido es **' + n(r, 1) + '**: hay una acidosis con anion gap alto oculta por la hipoalbuminemia.'
          : r > 12
            ? 'Anion gap corregido **elevado** (' + n(r, 1) + ').'
            : 'Anion gap corregido normal (' + n(r, 1) + ').';
      },
      implication: (r) => (r > 12 ? 'Busca cetoácidos, lactato, insuficiencia renal o tóxicos, aunque el AG sin corregir pareciera normal.' : 'Si hay acidosis, estudia causas de acidosis hiperclorémica.'),
      pitfall: 'Olvidar la corrección en pacientes críticos, cirróticos o desnutridos, en quienes la albúmina suele estar baja.',
      pearl: 'Por cada 1 g/dL que baja la albúmina, el AG «normal» baja ~2,5 mEq/L.',
      generate(rand) {
        const x = { na: U.randInt(132, 142, rand), cl: U.randInt(100, 110, rand), hco3: U.randInt(14, 20, rand), alb: U.randStep(1.6, 3.2, 0.1, rand) };
        return { inputs: x, context: 'Paciente en UCI con sepsis y desnutrición.', ask: 'Calcula el anion gap corregido por albúmina.' };
      },
    },
    {
      id: 'na_corregido',
      name: 'Sodio corregido por hiperglucemia',
      purpose: 'Estimar el sodio que tendría el paciente si la glucosa fuera normal: la hiperglucemia arrastra agua fuera de las células y diluye el sodio.',
      formula: 'Na⁺ corregido = Na⁺ medido + 1,6 × (glucosa − 100) / 100',
      inputs: [
        { id: 'na', label: 'Na⁺ medido', unit: 'mEq/L', example: 130 },
        { id: 'glu', label: 'Glucosa', unit: 'mg/dL', example: 700 },
      ],
      unit: 'mEq/L',
      decimals: 1,
      tol: 1.5,
      tolText: '± 1,5',
      diff: 2,
      notes: ['Factor clásico 1,6 (Katz). Con glucosa >400 mg/dL algunos autores prefieren 2,4 (Hillier): Sol MED acepta el resultado con 1,6 y muestra ambos en la explicación.'],
      compute: (x) => x.na + (1.6 * (x.glu - 100)) / 100,
      substitute: (x) =>
        'Na corregido = ' + n(x.na) + ' + 1,6 × (' + n(x.glu) + ' − 100) / 100 = ' + n(x.na + (1.6 * (x.glu - 100)) / 100, 1) + '  (con factor 2,4: ' + n(x.na + (2.4 * (x.glu - 100)) / 100, 1) + ')',
      interpret: (r, x) =>
        (r > 145 ? 'Sodio corregido **alto** (' + n(r, 1) + '): hay un déficit de agua libre importante' : r < 135 ? 'Sodio corregido bajo (' + n(r, 1) + '): hiponatremia verdadera' : 'Sodio corregido normal (' + n(r, 1) + ')') +
        (x.na < 135 ? ', aunque el sodio medido (' + n(x.na) + ') parecía bajo.' : '.'),
      implication: (r) =>
        r > 145
          ? 'Tras la reanimación inicial con cristaloide isotónico, suele pasarse a un líquido hipotónico (salino al 0,45 %) si el paciente está estable. Vigila que la osmolalidad baje de forma gradual.'
          : 'Tras la reanimación inicial, suele mantenerse el cristaloide isotónico.',
      pitfall: 'Interpretar un sodio medido de 130 en un EHH como «hiponatremia»: al corregirlo suele revelar hipernatremia.',
      pearl: 'Si al bajar la glucosa el sodio medido **no sube**, el paciente está recibiendo demasiada agua libre.',
      generate(rand) {
        const s = scenario(rand, ['ehh', 'cad']);
        const x = s === 'ehh' ? { na: U.randInt(128, 146, rand), glu: U.randInt(650, 1200, rand) } : { na: U.randInt(126, 138, rand), glu: U.randInt(300, 650, rand) };
        return { inputs: x, context: s === 'ehh' ? 'Mujer de 78 años, confusa, con poliuria durante 10 días.' : 'Varón de 22 años con diabetes tipo 1 y vómitos.', ask: 'Calcula el sodio corregido (factor 1,6).' };
      },
    },
    {
      id: 'osm_calc',
      name: 'Osmolalidad sérica calculada',
      purpose: 'Estimar la osmolalidad total y compararla con la medida (gap osmolar).',
      formula: 'Osm = 2 × Na⁺ + glucosa/18 + BUN/2,8',
      inputs: [
        { id: 'na', label: 'Na⁺', unit: 'mEq/L', example: 140 },
        { id: 'glu', label: 'Glucosa', unit: 'mg/dL', example: 900 },
        { id: 'bun', label: 'BUN', unit: 'mg/dL', example: 56 },
      ],
      unit: 'mOsm/kg',
      decimals: 0,
      tol: 3,
      tolText: '± 3',
      diff: 2,
      notes: ['Si el laboratorio informa urea en lugar de BUN: BUN = urea / 2,14 (o bien urea/6 en lugar de BUN/2,8).'],
      compute: (x) => 2 * x.na + x.glu / 18 + x.bun / 2.8,
      substitute: (x) =>
        'Osm = 2 × ' + n(x.na) + ' + ' + n(x.glu) + '/18 + ' + n(x.bun) + '/2,8 = ' + n(2 * x.na) + ' + ' + n(x.glu / 18, 1) + ' + ' + n(x.bun / 2.8, 1) + ' = ' + n(2 * x.na + x.glu / 18 + x.bun / 2.8),
      interpret: (r) => (r > 320 ? 'Osmolalidad total **>320 mOsm/kg**: cumple el criterio osmolar del EHH (2024).' : r > 295 ? 'Osmolalidad elevada.' : r < 275 ? 'Osmolalidad baja.' : 'Osmolalidad normal.'),
      implication: (r) =>
        r > 320
          ? 'Calcula también la efectiva (sin urea). El tratamiento debe bajarla de forma gradual (≈3–8 mOsm/kg/h, JBDS).'
          : 'Compárala con la medida: un gap osmolar >10 sugiere alcoholes tóxicos.',
      pitfall: 'Usar la osmolalidad total para explicar el coma: la urea no es osmóticamente efectiva.',
      pearl: 'Gap osmolar = medida − calculada; >10 sugiere metanol o etilenglicol.',
      generate(rand) {
        const x = { na: U.randInt(132, 155, rand), glu: U.randInt(500, 1300, rand), bun: U.randInt(25, 90, rand) };
        return { inputs: x, context: 'Anciano con demencia, obnubilado, con signos de deshidratación.', ask: 'Calcula la osmolalidad sérica total.' };
      },
    },
    {
      id: 'osm_ef',
      name: 'Osmolalidad efectiva',
      purpose: 'Medir la tonicidad (lo que desplaza agua y afecta a las neuronas). Es el criterio osmolar del EHH.',
      formula: 'Osm efectiva = 2 × Na⁺ + glucosa/18',
      inputs: [
        { id: 'na', label: 'Na⁺', unit: 'mEq/L', example: 140 },
        { id: 'glu', label: 'Glucosa', unit: 'mg/dL', example: 900 },
      ],
      unit: 'mOsm/kg',
      decimals: 0,
      tol: 3,
      tolText: '± 3',
      diff: 1,
      compute: (x) => 2 * x.na + x.glu / 18,
      substitute: (x) => 'Osm efectiva = 2 × ' + n(x.na) + ' + ' + n(x.glu) + '/18 = ' + n(2 * x.na) + ' + ' + n(x.glu / 18, 1) + ' = ' + n(2 * x.na + x.glu / 18),
      interpret: (r) =>
        r > 320
          ? 'Osmolalidad efectiva **>320**: hiperosmolalidad marcada, que puede explicar estupor o coma.'
          : r > 300
            ? 'Osmolalidad efectiva **>300**: cumple el criterio osmolar del EHH (2024).'
            : 'Osmolalidad efectiva ≤300: no cumple el criterio osmolar del EHH.',
      implication: (r) =>
        r > 300
          ? 'Si además la glucosa es ≥600, el β-OHB <3,0 y no hay acidosis relevante → EHH. Reposición de volumen primero; la insulina, a dosis más bajas y cuando la glucosa deje de bajar solo con líquidos.'
          : 'Si el paciente está en coma con osmolalidad efectiva <320, busca otra causa del coma.',
      pitfall: 'Aplicar el umbral antiguo (>320, de 2009) como único criterio: en 2024 es >300 efectiva o >320 total.',
      pearl: 'Coma + osmolalidad efectiva <320 → busca otra causa (ictus, sepsis, tóxicos, convulsiones).',
      generate(rand) {
        const x = { na: U.randInt(130, 158, rand), glu: U.randInt(250, 1300, rand) };
        return { inputs: x, context: 'Paciente con hiperglucemia y deterioro del nivel de conciencia.', ask: 'Calcula la osmolalidad efectiva.' };
      },
    },
    {
      id: 'winter',
      name: 'Compensación respiratoria esperada (fórmula de Winter)',
      purpose: 'En una acidosis metabólica, comprobar si la respuesta respiratoria es la adecuada o si hay un trastorno respiratorio asociado.',
      formula: 'PaCO₂ esperada = 1,5 × HCO₃⁻ + 8 (± 2)',
      inputs: [
        { id: 'hco3', label: 'HCO₃⁻', unit: 'mEq/L', example: 8 },
        { id: 'paco2', label: 'PaCO₂ medida', unit: 'mmHg', example: 20 },
      ],
      unit: 'mmHg',
      decimals: 0,
      tol: 1,
      tolText: 'valor central ± 1',
      diff: 2,
      compute: (x) => 1.5 * x.hco3 + 8,
      substitute: (x) => 'PaCO₂ esperada = 1,5 × ' + n(x.hco3) + ' + 8 = ' + n(1.5 * x.hco3 + 8, 1) + ' (rango ' + n(1.5 * x.hco3 + 6, 1) + '–' + n(1.5 * x.hco3 + 10, 1) + ')',
      interpret: (r, x) => {
        const lo = r - 2;
        const hi = r + 2;
        if (x.paco2 > hi) return 'La PaCO₂ medida (' + n(x.paco2) + ') es **mayor** que la esperada (' + n(lo) + '–' + n(hi) + '): hay una **acidosis respiratoria** asociada.';
        if (x.paco2 < lo) return 'La PaCO₂ medida (' + n(x.paco2) + ') es **menor** que la esperada (' + n(lo) + '–' + n(hi) + '): hay una **alcalosis respiratoria** asociada.';
        return 'La PaCO₂ medida (' + n(x.paco2) + ') está dentro de lo esperado (' + n(lo) + '–' + n(hi) + '): compensación respiratoria adecuada.';
      },
      implication: (r, x) =>
        x.paco2 > r + 2
          ? 'Busca fatiga respiratoria, sedación, neumonía o coma: el paciente puede necesitar soporte ventilatorio. Si se intuba, hay que mantener la hiperventilación para no agravar la acidosis.'
          : x.paco2 < r - 2
            ? 'Busca causas de hiperventilación primaria: sepsis, salicilatos, embolia pulmonar, dolor.'
            : 'El trastorno es una acidosis metabólica simple compensada.',
      pitfall: 'Considerar «normal» una PaCO₂ de 40 en una acidosis metabólica grave: indica fallo respiratorio.',
      pearl: 'La compensación respiratoria completa tarda 12–24 h en desarrollarse.',
      generate(rand) {
        const hco3 = U.randInt(4, 16, rand);
        const expected = 1.5 * hco3 + 8;
        const kind = scenario(rand, ['ok', 'ok', 'resp-acid', 'resp-alk']);
        const paco2 = Math.round(kind === 'ok' ? expected + (rand() * 3 - 1.5) : kind === 'resp-acid' ? expected + 6 + rand() * 10 : Math.max(10, expected - 6 - rand() * 6));
        return { inputs: { hco3, paco2 }, context: 'Acidosis metabólica en un paciente con cetoacidosis diabética.', ask: 'Calcula la PaCO₂ esperada (valor central) y compárala con la medida.' };
      },
    },
    {
      id: 'delta_delta',
      name: 'Delta-delta (ΔAG / ΔHCO₃⁻)',
      purpose: 'En una acidosis con anion gap alto, detectar si coexiste una acidosis hiperclorémica o una alcalosis metabólica.',
      formula: 'Δ/Δ = (AG − 12) / (24 − HCO₃⁻)',
      inputs: [
        { id: 'na', label: 'Na⁺', unit: 'mEq/L', example: 136 },
        { id: 'cl', label: 'Cl⁻', unit: 'mEq/L', example: 100 },
        { id: 'hco3', label: 'HCO₃⁻', unit: 'mEq/L', example: 12 },
      ],
      unit: '',
      decimals: 1,
      tol: 0.2,
      tolText: '± 0,2',
      diff: 3,
      notes: ['Usa AG normal = 12 y HCO₃⁻ normal = 24 (valores convencionales).'],
      compute: (x) => (x.na - x.cl - x.hco3 - 12) / (24 - x.hco3),
      substitute: (x) => {
        const ag = x.na - x.cl - x.hco3;
        return 'AG = ' + n(ag) + ' → Δ/Δ = (' + n(ag) + ' − 12) / (24 − ' + n(x.hco3) + ') = ' + n(ag - 12) + ' / ' + n(24 - x.hco3) + ' = ' + n((ag - 12) / (24 - x.hco3), 2);
      },
      interpret: (r) =>
        r < 1
          ? 'Δ/Δ **<1**: el bicarbonato bajó más de lo que explica el anion gap → hay además una **acidosis con AG normal (hiperclorémica)**.'

            ? 'Δ/Δ **>2**: el bicarbonato está más alto de lo esperado → hay además una **alcalosis metabólica** (por ejemplo, por vómitos).'
            : 'Δ/Δ entre 1 y 2: acidosis con anion gap alto **pura**.',
      implication: (r) =>
        r < 1
          ? 'En la CAD es típico durante la fase de recuperación con suero salino, o si hubo diarrea.'
          : r > 2
            ? 'En la CAD con muchos vómitos, la alcalosis puede «normalizar» el pH y hacer pasar la cetoacidosis inadvertida.'
            : 'No hay un segundo trastorno metabólico.',
      pitfall: 'Aplicarlo cuando el anion gap es normal: solo tiene sentido en acidosis con AG alto.',
      pearl: 'Una CAD con muchos vómitos puede tener un pH casi normal: el delta-delta lo delata.',
      generate(rand) {
        const kind = scenario(rand, ['pure', 'hcl', 'alk']);

        const dh = 24 - hco3;
        const ratio = kind === 'pure' ? 1.1 + rand() * 0.5 : kind === 'hcl' ? 0.3 + rand() * 0.4 : 2.5 + rand() * 1.0;
        const ag = Math.round(12 + dh * ratio);
        const na = U.randInt(132, 142, rand);
        const cl = na - ag - hco3;
        return {
          inputs: { na, cl, hco3 },
          context: kind === 'alk' ? 'CAD en un paciente con vómitos incoercibles durante 3 días.' : 'Paciente con cetoacidosis diabética.',
          ask: 'Calcula el delta-delta (usa AG normal 12 y HCO₃⁻ normal 24).',
        };
      },
    },
    {
      id: 'deficit_agua',
      name: 'Déficit de agua libre',
      purpose: 'Estimar el agua que falta en la hipernatremia, para planificar su reposición gradual.',
      formula: 'Déficit (L) = ACT × (Na⁺ / 140 − 1); ACT = peso × fracción de agua',
      inputs: [

/* Almacenamiento local y modelo de datos del progreso.
 *
 * El progreso se guarda como un registro de intentos (solo se añaden). Todo
 * lo demás (repetición espaciada, dominio, puntos débiles, dificultad) se
 * recalcula a partir de ese registro en engine.js. Esto hace que fusionar
 * datos de dos dispositivos o de un respaldo sea seguro: se unen los
 * intentos por id y nunca se pisa un dato reciente con uno antiguo.

  const U = S.util;
  const KEY = 'solmed.v1';

  const DEFAULT_PREFS = {
    theme: 'system', // 'light' | 'dark' | 'system'
    sessionSize: 10,
    reduceMotion: false,
  };

  let state = null;
  let storageOk = true;
  let storageError = '';
  let saveTimer = null;
  const listeners = [];

  function blank() {
    return {
      schema: S.schema,
      deviceId: U.uid('d'),
      attempts: [],
      exams: [],
      prefs: Object.assign({}, DEFAULT_PREFS),
      prefsAt: 0,
      resume: null,
      resumeAt: 0,
      resetAt: 0,
      meta: { createdAt: Date.now(), lastBackup: 0, lastSync: 0, lastImport: 0 },

      storageOk = true;
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      storageOk = false;
      storageError = String(e && e.message ? e.message : e);
      return null;
    }
  }

  function upgrade(s) {
    const b = blank();
    const out = Object.assign(b, s || {});
    out.prefs = Object.assign({}, DEFAULT_PREFS, (s && s.prefs) || {});
    out.meta = Object.assign(b.meta, (s && s.meta) || {});
    out.attempts = Array.isArray(out.attempts) ? out.attempts.filter(validAttempt) : [];
    out.exams = Array.isArray(out.exams) ? out.exams.filter((e) => e && e.id) : [];
    out.schema = S.schema;
    return out;
  }

  function validAttempt(a) {
    return a && typeof a.id === 'string' && typeof a.t === 'number' && typeof a.item === 'string' && typeof a.score === 'number';
  }

  function load() {
    state = upgrade(readRaw());
    return state;
  }

  function writeNow() {
    clearTimeout(saveTimer);
    saveTimer = null;
    try {
      window.localStorage.setItem(KEY, JSON.stringify(state));
      storageOk = true;
      storageError = '';

      storageError = String(e && e.message ? e.message : e);

    }

    listeners.push(fn);

  }

  function addAttempt(a) {

    state.attempts.push(rec);
